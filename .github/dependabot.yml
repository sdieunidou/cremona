version: 2
updates:
  # Minor and patch updates come grouped; every major update gets its own pull request, so a
  # breaking release (motion, React, Tailwind, TypeScript…) is reviewed and tested on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # a library: move the lockfile, and a manifest range only when the new version is outside it
    # (otherwise every minor release would raise the minimum the packages ask of their hosts)
    versioning-strategy: increase-if-necessary
    ignore:
      # types of the Node versions CI runs (22, 24): a newer major would type APIs they lack
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
