name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:use-client
      - run: pnpm test
      - name: Generated files are up to date
        run: |
          pnpm generate:stimulus
          pnpm generate:api
          pnpm build:css
          changed=$(git status --porcelain -- packages/blocks packages/stimulus packages/tokens)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Generated files changed or were added: run 'pnpm test', 'pnpm generate:stimulus', 'pnpm generate:api' and 'pnpm build:css', then commit."
            exit 1
          fi
      - run: pnpm validate

  motion-13:
    # @cremona/blocks accepts motion ^12 || ^13; the lockfile pins 12, this job runs the block
    # gates (parity, end state, triggers) on the newest 13 as well
    name: Blocks on motion 13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cremona/blocks add -D motion@^13
      - run: pnpm --filter @cremona/blocks test

  e2e:
    name: Gallery e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gallery:build
      - run: pnpm --filter @cremona/gallery exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/gallery/playwright-report
            apps/gallery/test-results
          retention-days: 7
