name: Release

# Versioning is automatic, publishing is not (docs/releasing.md):
# - push to main with pending changesets → opens/updates the "chore: version packages" PR;
# - publishing runs only when this workflow is started by hand on main with publish=true.
#   It authenticates with npm trusted publishing (OIDC): no npm token, provenance attached.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish every @cremona package whose version is not on npm yet
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push'
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    name: Publish to npm
    runs-on: ubuntu-latest
    # npm's trusted publisher for each package names this workflow and this environment
    environment: npm
    permissions:
      contents: write # push the release tags
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No registry-url and no dependency cache: pnpm exchanges the OIDC token itself
      # (an .npmrc token placeholder would be sent instead), and a release build
      # installs from the lockfile only.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @cremona/blocks check:package
      - run: pnpm release
        env:
          PNPM_CONFIG_PROVENANCE: "true"
      - run: git push --tags
